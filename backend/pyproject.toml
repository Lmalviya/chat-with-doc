[project]
name = "qna-bot-backend"
version = "0.1.0"
description = "FastAPI backend with LangChain/LangGraph for Document Q&A Bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.1",
    "langchain>=0.3.14",
    "langchain-core>=0.3.29",
    "langgraph>=0.2.60",
    "langchain-google-genai>=2.0.8",
    "langchain-nvidia-ai-endpoints>=0.3.7",
    "langsmith>=0.3.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "boto3>=1.35.0",
    "aioboto3>=13.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
